<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
<meta name="robots" content="noindex">
<title>404 — Abhinav Kumar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-family='monospace' font-size='58' font-weight='700' fill='%23ff2b3d' text-anchor='middle'%3E%3C/%3E%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #0d1117;
  --bg-tertiary: #161b22;
  --neon-red: #ff2b3d;
  --neon-blue: #00d4ff;
  --text-primary: #c9d1d9;
  --text-secondary: #8b949e;
  --text-dim: #484f58;
  --border-color: #30363d;
  --glow-red: 0 0 10px #ff2b3d, 0 0 20px #ff2b3d, 0 0 40px #ff2b3d;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family: "Fira Code", "JetBrains Mono", monospace;
  background: var(--bg-primary);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background: radial-gradient(circle at 20% 20%, rgba(0,212,255,.12), transparent 30%), radial-gradient(circle at 80% 80%, rgba(255,43,61,.1), transparent 34%), var(--bg-primary);
}
#matrix-canvas { position: fixed; inset: 0; z-index: 0; opacity: .12; pointer-events: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--neon-red); outline-offset: 3px; border-radius: 4px; }
.wrap { position: relative; z-index: 2; width: 100%; max-width: 640px; }
.terminal-window { background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.015)), var(--bg-secondary); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; overflow: hidden; box-shadow: 0 22px 70px rgba(0,0,0,.4); }
.terminal-header { display: flex; align-items: center; padding: 12px 16px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border-color); }
.terminal-dots { display: flex; gap: 8px; margin-right: 16px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.red { background: #ff5f57; } .dot.yellow { background: #febc2e; } .dot.green { background: #28c840; }
.terminal-title { font-size: .75rem; color: var(--text-dim); }
.terminal-body { padding: 26px; font-size: .86rem; line-height: 1.9; }
.line .prompt { color: var(--neon-red); margin-right: 10px; }
.line .path { color: var(--neon-blue); word-break: break-all; }
.err { color: var(--text-secondary); padding-left: 20px; margin-bottom: 8px; }
.big404 { font-size: clamp(2.4rem, 8vw, 3.4rem); font-weight: 900; color: var(--neon-red); text-shadow: var(--glow-red); letter-spacing: .04em; margin: 18px 0 6px; }
.sub { color: var(--text-secondary); margin-bottom: 22px; }
.links { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { font-family: inherit; font-weight: 700; font-size: .85rem; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--neon-red); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all .25s ease; }
.btn-primary { background: var(--neon-red); color: #180608; }
.btn-primary:hover { box-shadow: var(--glow-red); transform: translateY(-2px); }
.btn-outline { background: transparent; color: var(--neon-blue); border-color: rgba(0,212,255,.4); }
.btn-outline:hover { background: rgba(0,212,255,.1); transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<canvas id="matrix-canvas" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="terminal-window">
    <div class="terminal-header">
      <div class="terminal-dots"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
      <span class="terminal-title">not-found.sh</span>
    </div>
    <div class="terminal-body">
      <div class="line"><span class="prompt">$</span>cd <span class="path" id="reqPath"></span></div>
      <div class="err" id="errLine"></div>
      <div class="big404">404</div>
      <p class="sub">That page doesn't exist. It might've moved, or you typed something wrong.</p>
      <div class="links">
        <a href="/" class="btn btn-primary">cd ~</a>
        <a href="/#projects" class="btn btn-outline">ls projects/</a>
      </div>
    </div>
  </div>
</div>
<script>
var path = window.location.pathname || '/';
document.getElementById('reqPath').textContent = path;
document.getElementById('errLine').textContent = 'bash: cd: ' + path + ': No such file or directory';

(function(){
  var canvas = document.getElementById('matrix-canvas');
  var ctx = canvas.getContext('2d');
  var chars = '01アイウエオカキクケコサシスセソ';
  var cols, drops;
  function size(){
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 16);
    drops = Array.from({length: cols}, function(){ return Math.random() * -100; });
  }
  size();
  window.addEventListener('resize', size);
  function draw(){
    ctx.fillStyle = 'rgba(10,10,10,0.06)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff2b3d';
    ctx.font = '14px monospace';
    for (var i = 0; i < drops.length; i++) {
      var ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * 16, drops[i] * 16);
      if (drops[i] * 16 > canvas.height && Math.random() > .975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(draw);
})();
</script>
</body>
</html>
