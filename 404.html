<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
<meta name="robots" content="noindex">
<title>404 — Abhinav Kumar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f12;
  --panel: #15181d;
  --panel-2: #1a1e24;
  --border: #262b33;
  --ink: #e7e9ec;
  --ink-dim: #9aa0ab;
  --ink-faint: #5b6270;
  --accent: #d38a45;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
.wrap { width: 100%; max-width: 600px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.panel-label { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: .72rem; color: var(--ink-faint); }
.panel-body { padding: 28px; }
.line { font-size: .86rem; margin-bottom: 4px; }
.line .prompt { color: var(--accent); margin-right: 8px; }
.line .path { color: var(--ink-dim); word-break: break-all; }
.err { color: var(--ink-faint); font-size: .82rem; padding-left: 18px; margin-bottom: 20px; }
.big404 { font-size: clamp(2.2rem, 7vw, 3rem); font-weight: 700; color: var(--accent); letter-spacing: -.01em; margin: 6px 0 8px; }
.sub { color: var(--ink-dim); margin-bottom: 24px; font-size: .92rem; }
.links { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: .86rem; padding: 11px 20px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all .2s ease; }
.btn-primary { background: var(--accent); color: #1a0f04; }
.btn-primary:hover { background: #e0985a; }
.btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--ink-dim); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="panel-label mono">not-found.sh</div>
    <div class="panel-body">
      <div class="line mono"><span class="prompt">$</span>cd <span class="path" id="reqPath"></span></div>
      <div class="err mono" id="errLine"></div>
      <div class="big404">404</div>
      <p class="sub">That page doesn't exist. It might've moved, or you typed something wrong.</p>
      <div class="links">
        <a href="/" class="btn btn-primary">Home</a>
        <a href="/#projects" class="btn btn-outline">Projects</a>
      </div>
    </div>
  </div>
</div>
<script>
var path = window.location.pathname || '/';
document.getElementById('reqPath').textContent = path;
document.getElementById('errLine').textContent = 'bash: cd: ' + path + ': No such file or directory';
</script>
</body>
</html>
